name: HireMate Backend CI - TestNG & JaCoCo

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Run TestNG Unit Tests & JaCoCo Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run TestNG Tests with JaCoCo
        working-directory: ./hiremate-backend
        run: |
          mvn clean test jacoco:report -B

      - name: Upload TestNG & Surefire Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-surefire-reports
          path: hiremate-backend/target/surefire-reports/
          retention-days: 14

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: hiremate-backend/target/site/jacoco/
          retention-days: 14
