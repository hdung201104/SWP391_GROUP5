server:
  port: 8088

spring:
  application:
    name: hiremate
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres.orkdazjoorfdwlfbrmxf}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Hoangdung1122}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:30}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 30000
      leak-detection-threshold: 30000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  jpa:
    open-in-view: false         # Tránh lock connection database trong suốt request lifecycle và AI calls
    hibernate:
      ddl-auto: none            # Dùng trực tiếp schema Supabase PostgreSQL, không can thiệp schema
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          fetch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
  flyway:
    enabled: false              # Tắt Flyway, toàn bộ 20 bảng CSDL quản lý tập trung trên Supabase qua HireMate_AI_New.sql
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:hdung201104@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

jwt:
  secret: your-256-bit-secret-key-hiremate-ai-development-token-secret-2026
  expiration-ms: 86400000

