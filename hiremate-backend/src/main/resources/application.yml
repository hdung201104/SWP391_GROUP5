server:
  port: 8088

spring:
  application:
    name: hiremate
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:${DB_PORT:6543}/${DB_NAME:postgres}?sslmode=require&prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres.orkdazjoorfdwlfbrmxf}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Hoangdung1122}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 20000
      idle-timeout: 60000
      max-lifetime: 180000
      keepalive-time: 30000
  jpa:
    hibernate:
      ddl-auto: none            # Dùng trực tiếp schema Supabase PostgreSQL, không can thiệp schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false              # Tắt Flyway, toàn bộ 20 bảng CSDL quản lý tập trung trên Supabase qua HireMate_AI_New.sql
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:hdung201104@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

